name: Test SSH Connection

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ssh-baudelot.alwaysdata.net >> ~/.ssh/known_hosts

      - name: SSH and run Hello World
        env:
          SSH_AUTH_SOCK: none  # <<< désactive l'agent SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes baudelot@ssh-baudelot.alwaysdata.net 'echo "✅ Hello from AlwaysData via GitHub Actions !"'
